{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="background: linear-gradient(145deg, #1e293b, #0f172a); border-top: 4px solid var(--accent-gold); padding: 2.25rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; background: rgba(245, 158, 11, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; color: var(--accent-gold); font-size: 1.8rem;">
        👤
      </div>
      <h2 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem;">
        CREATE AN ACCOUNT
      </h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary);">
        PLAYER PERFORMANCE RANKING DASHBOARD
      </p>
    </div>

    {% if error %}
      <div class="badge badge-excellent" style="background: rgba(239, 68, 68, 0.2); color: var(--accent-red); display: block; padding: 0.75rem; margin-bottom: 1.5rem; text-align: center;">
        <i data-lucide="alert-circle"></i> {{ error }}
      </div>
    {% endif %}

    <form action="/register" method="POST">
      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address *</label>
        <input type="email" id="reg-email" name="email" class="form-control" placeholder="user@domain.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-username">Username *</label>
        <input type="text" id="reg-username" name="username" class="form-control" placeholder="Choose a username" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-password">Password *</label>
        <input type="password" id="reg-password" name="password" class="form-control" placeholder="Choose a strong password" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="reg-role">User Role *</label>
        <select id="reg-role" name="role" class="form-control" required>
          <option value="Analyst">Analyst (Read-only Analytics)</option>
          <option value="Admin">Admin (Full Dataset CRUD & Algorithm Control)</option>
        </select>
      </div>

      <button type="submit" class="btn btn-accent" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 700;">
        <i data-lucide="user-plus"></i> Register Account
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Already registered? <a href="/login" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Sign In Here</a>
    </div>

  </div>
</div>
{% endblock %}

{% block tech_used %}{% endblock %}
