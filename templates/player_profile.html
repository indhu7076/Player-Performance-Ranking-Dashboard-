{% extends "base.html" %}

{% block content %}
<div id="player-profile-page" data-player-id="{{ player_id }}">

  <!-- Header Card -->
  <div class="card" style="margin-bottom: 2rem; background: linear-gradient(145deg, #1e293b, #111827); border-left: 4px solid var(--accent-cyan);">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1.5rem;">
      
      <div style="display: flex; align-items: center; gap: 1.25rem;">
        <div style="width: 70px; height: 70px; background: rgba(6, 182, 212, 0.15); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--accent-cyan); font-size: 2rem; font-weight: 800;">
          <i data-lucide="user"></i>
        </div>
        <div>
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <h2 id="prof-name" style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 700;">Loading...</h2>
            <span class="badge badge-very-good" id="prof-level">—</span>
          </div>
          <div style="color: var(--text-secondary); font-size: 0.95rem; margin-top: 0.2rem;" id="prof-subtitle">
            —
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 1.5rem; align-items: center;">
        <div style="text-align: right;">
          <div style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Rank</div>
          <div style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800; color: var(--accent-gold);" id="prof-rank">
            #—
          </div>
        </div>

        <div style="text-align: right;">
          <div style="font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase;">Performance Score</div>
          <div style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800; color: var(--accent-cyan);" id="prof-score">
            —
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Key Metrics Cards -->
  <div class="kpi-grid" style="margin-bottom: 2rem;">
    <div class="kpi-card">
      <div class="kpi-header"><span class="kpi-label">Matches</span></div>
      <div class="kpi-value" id="prof-matches">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-header"><span class="kpi-label">Goals</span></div>
      <div class="kpi-value" id="prof-goals">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-header"><span class="kpi-label">Assists</span></div>
      <div class="kpi-value" id="prof-assists">—</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-header"><span class="kpi-label">Passing Accuracy</span></div>
      <div class="kpi-value" id="prof-passing">—%</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-header"><span class="kpi-label">Defensive Rating</span></div>
      <div class="kpi-value" id="prof-defense">—</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-header"><span class="kpi-label">Fitness Index</span></div>
      <div class="kpi-value" id="prof-fitness">—</div>
    </div>
  </div>

  <!-- Radar Breakdown Chart -->
  <div class="card col-12" style="margin-bottom: 2rem;">
    <div class="card-title">
      <span><i data-lucide="radar"></i> Individual Performance Metric Breakdown</span>
    </div>
    <div class="chart-container" style="height: 350px;">
      <canvas id="prof-radar-chart"></canvas>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const pid = document.getElementById('player-profile-page').getAttribute('data-player-id');
  if (pid) fetchPlayerProfile(pid);
});

function fetchPlayerProfile(pid) {
  fetch(`/api/player/${pid}`)
    .then(res => res.json())
    .then(data => {
      if (data.success && data.player) {
        renderProfile(data.player);
      }
    });
}

function renderProfile(p) {
  document.getElementById('prof-name').textContent = p['Player Name'];
  document.getElementById('prof-level').textContent = p['Performance Level'];
  document.getElementById('prof-subtitle').textContent = `${p.Team} • ${p.Position} • Age ${p.Age}`;
  document.getElementById('prof-rank').textContent = `#${p.Rank}`;
  document.getElementById('prof-score').textContent = `${p['Performance Score']} pts`;

  document.getElementById('prof-matches').textContent = p.Matches;
  document.getElementById('prof-goals').textContent = p.Goals;
  document.getElementById('prof-assists').textContent = p.Assists;
  document.getElementById('prof-passing').textContent = `${p.Passing}%`;
  document.getElementById('prof-defense').textContent = p.Defense;
  document.getElementById('prof-fitness').textContent = p.Fitness;

  // Radar chart
  const ctx = document.getElementById('prof-radar-chart');
  if (ctx && typeof Chart !== 'undefined') {
    new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['Goals', 'Assists', 'Passing', 'Defense', 'Fitness'],
        datasets: [{
          label: `${p['Player Name']} Normalized Sub-scores`,
          data: [
            p.norm_goals || 50,
            p.norm_assists || 50,
            p.norm_passing || 50,
            p.norm_defense || 50,
            p.norm_fitness || 50
          ],
          borderColor: '#06b6d4',
          backgroundColor: 'rgba(6, 182, 212, 0.2)'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { r: { grid: { color: '#334155' }, ticks: { color: '#64748b' } } },
        plugins: { legend: { labels: { color: '#94a3b8' } } }
      }
    });
  }
}
</script>
{% endblock %}
