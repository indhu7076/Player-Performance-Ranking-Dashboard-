{% extends "base.html" %}

{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
  <div class="card" style="background: linear-gradient(145deg, #1e293b, #0f172a); border-top: 4px solid var(--accent-cyan); padding: 2.25rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; background: rgba(6, 182, 212, 0.15); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; color: var(--accent-cyan); font-size: 1.8rem;">
        🏆
      </div>
      <h2 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem;">
        USER LOGIN
      </h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary);">
        PLAYER PERFORMANCE RANKING DASHBOARD
      </p>
    </div>

    {% if error %}
      <div class="badge badge-excellent" style="background: rgba(239, 68, 68, 0.2); color: var(--accent-red); display: block; padding: 0.75rem; margin-bottom: 1.5rem; text-align: center;">
        <i data-lucide="alert-circle"></i> {{ error }}
      </div>
    {% endif %}

    <form action="/login" method="POST" id="login-form">
      <div class="form-group">
        <label class="form-label" for="login-username">Username *</label>
        <input type="text" id="login-username" name="username" class="form-control" placeholder="Enter username (e.g. admin)" required>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="login-password">Password *</label>
        <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter password (e.g. admin123)" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem; font-weight: 700;">
        <i data-lucide="log-in"></i> Sign In
      </button>
    </form>

    <!-- Quick Demo Accounts Launcher -->
    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); text-align: center;">
      <span style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 0.85rem;">
        ⚡ Quick Demo Accounts
      </span>
      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="autoFillLogin('admin', 'admin123')">
          <i data-lucide="shield"></i> Login as Admin
        </button>
        <button type="button" class="btn btn-outline btn-sm" onclick="autoFillLogin('analyst', 'analyst123')">
          <i data-lucide="user"></i> Login as Analyst
        </button>
      </div>
    </div>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-muted);">
      Don't have an account? <a href="/register" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Register Here</a>
    </div>

  </div>
</div>
{% endblock %}

{% block tech_used %}{% endblock %}

{% block scripts %}
<script>
function autoFillLogin(user, pass) {
  document.getElementById('login-username').value = user;
  document.getElementById('login-password').value = pass;
  document.getElementById('login-form').submit();
}
</script>
{% endblock %}
